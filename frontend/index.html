<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover — чтобы сцена уходила под «чёлку», а панели отступали
      от неё через env(safe-area-inset-*).
      maximum-scale=1 — двойной тап по 3D-сцене не должен масштабировать
      страницу: масштабом модели управляет сама сцена.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <title>3D-мониторинг строительства</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
