# nginx: раздаёт собранный фронтенд и проксирует всё остальное на бэкенд.
#
# Ключевое: фронтенд и API живут на ОДНОМ адресе. Клиент ходит относительными
# путями (`fetch('/api/...')`), а WebSocket собирает адрес из
# window.location.host. Разнеси их по разным хостам — и придётся настраивать
# CORS, и всё равно сломается WebSocket.

# Апстрим вынесен отдельно: имя `api` резолвит внутренний DNS compose.
upstream backend {
    server api:8000;
    keepalive 16;
}

# Заголовок Connection для проксирования: «upgrade» только когда клиент
# действительно просит апгрейд, иначе пустой — иначе keepalive ломается.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Предел на загружаемый файл. Держать НЕ МЕНЬШЕ APP_MAX_MODEL_MB, иначе
    # nginx отрежет большую модель раньше, чем её увидит приложение, и
    # пользователь получит невнятную 413 вместо понятной ошибки от API.
    client_max_body_size 512m;
    client_body_timeout 300s;

    # Логи уходят в stdout/stderr контейнера — их видно через `docker compose logs`.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Сжатие статики. Основной чанк приложения ~900 КБ, в gzip ~250 КБ —
    # на медленном канале это разница между «открылось» и «висит».
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # ------------------------------------------------------------ API
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Загрузка модели идёт потоком, а не копится целиком во временный файл
        # nginx: полгигабайта на диск ради пересылки — лишняя запись и лишняя
        # задержка перед стартом обработки.
        proxy_request_buffering off;

        # Выгрузка в Excel и разбор большой .glb на стороне API занимают время.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ------------------------------------------------- файлы моделей и вложений
    # Раздаются приложением с проверкой прав, а не как открытая статика:
    # прямой доступ к /media в обход токена дал бы чужие модели любому.
    location /media/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Модель на десятки мегабайт отдаётся потоком: с буферизацией nginx
        # сначала выкачал бы файл целиком себе, и браузер всё это время ждал
        # первый байт, показывая пустую сцену.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------- реальное время
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;

        # Соединение висит открытым и оживает только на ping клиента раз в
        # ~30 с. Со стандартными 60 с nginx рвал бы его в тишине, и обновления
        # «в реальном времени» молча переставали приходить.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------- статика
    # Имена файлов сборки содержат хеш содержимого, поэтому их можно кэшировать
    # навсегда: при новой версии меняется имя, а не содержимое старого файла.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA: маршрутизация на стороне клиента (createWebHistory). Без этого
    # правила перезагрузка страницы на /projects/1 вернула бы 404 — такого
    # файла на диске нет.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html кэшировать нельзя: в нём ссылки на новые хеши, и
        # закэшированный старый оставил бы пользователя на прошлой версии.
        add_header Cache-Control "no-cache";
    }
}
